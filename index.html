<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameZone</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#10131a;color:#fff}
header{padding:28px 18px;text-align:center;background:#171c27}
h1{margin:0 0 8px;font-size:34px}header p{margin:0;color:#b9c0ce}
.grid{max-width:900px;margin:28px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#1b2130;border-radius:18px;padding:22px;box-shadow:0 8px 25px #0005}
.card h2{margin-top:0}.card p{color:#b9c0ce;min-height:42px}
.btn{display:inline-block;text-decoration:none;background:#fff;color:#111;padding:12px 18px;border-radius:10px;font-weight:bold}
footer{text-align:center;color:#8e96a6;padding:30px}
</style></head>
<body>
<header><h1>🎮 GameZone</h1><p>Free browser games — play on your phone or computer</p></header>
<main class="grid">
<section class="card"><h2>🐍 Snake</h2><p>Classic snake game. Eat food and beat your high score.</p><a class="btn" href="games/snake/">Play Now</a></section>
<section class="card"><h2>⭕ Tic-Tac-Toe</h2><p>Play the classic game against a simple computer opponent.</p><a class="btn" href="games/tictactoe/">Play Now</a></section>
</main>
<footer>© 2026 GameZone • Free games</footer>
</body></html>
